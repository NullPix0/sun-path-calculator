<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sun Path Calculator</title>
    <style>
    body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    }

    #visual-area {
    margin-top: 20px;
    border: solid 1px #ccc;
    min-height: 300px;
    }

     canvas {
        background-color: white;
        border-radius: 4px;
    }
</style>
</head>
<body>
    
<h1>Sun Path Calculator</h1>

    <div>
    <label for="tanggal">Pilih Tanggal:</label>
    <input type="date" id="tanggal">
    </div>
    
    <div id="visual-area">
     <canvas id="sunChart" width="400" height="400"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
    <script src="script.js"></script>
</body>
</html>
